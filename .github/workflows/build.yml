name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Attach built artifacts to this release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  checks:
    name: Tests & Lints
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build compress-engine (all platforms)
        run: |
          cd compress-engine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../src-tauri/compress-engine-windows.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../src-tauri/compress-engine-macos .
          cd ..
      - name: Install dependencies
        run: npm ci
      - name: Type check & build
        run: npm run build
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  build-macos:
    name: macOS (Apple Silicon)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build compress-engine (all platforms)
        run: |
          cd compress-engine
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../src-tauri/compress-engine-windows.exe .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../src-tauri/compress-engine-macos .
          cd ..
      - name: Generate icon.icns from PNGs
        run: |
          mkdir -p src-tauri/icons/rocktier.iconset
          cp src-tauri/icons/16x16.png src-tauri/icons/rocktier.iconset/icon_16x16.png
          cp src-tauri/icons/32x32.png src-tauri/icons/rocktier.iconset/icon_16x16@2x.png
          cp src-tauri/icons/32x32.png src-tauri/icons/rocktier.iconset/icon_32x32.png
          cp src-tauri/icons/64x64.png src-tauri/icons/rocktier.iconset/icon_32x32@2x.png
          cp src-tauri/icons/128x128.png src-tauri/icons/rocktier.iconset/icon_128x128.png
          cp src-tauri/icons/256x256.png src-tauri/icons/rocktier.iconset/icon_128x128@2x.png
          cp src-tauri/icons/256x256.png src-tauri/icons/rocktier.iconset/icon_256x256.png
          cp src-tauri/icons/512x512.png src-tauri/icons/rocktier.iconset/icon_256x256@2x.png
          cp src-tauri/icons/512x512.png src-tauri/icons/rocktier.iconset/icon_512x512.png
          cp src-tauri/icons/1024x1024.png src-tauri/icons/rocktier.iconset/icon_512x512@2x.png
          iconutil -c icns src-tauri/icons/rocktier.iconset -o src-tauri/icons/icon.icns
          rm -rf src-tauri/icons/rocktier.iconset
      - name: Install dependencies
        run: npm ci
      - name: Build DMG
        run: npm run tauri build
      - name: Upload DMG to Release
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} src-tauri/target/release/bundle/dmg/*.dmg --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64 (MSI + NSIS)
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build compress-engine (all platforms)
        run: |
          cd compress-engine
          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
          go build -o ../src-tauri/compress-engine-windows.exe .
          $env:CGO_ENABLED='0'; $env:GOOS='darwin'; $env:GOARCH='arm64'
          go build -o ../src-tauri/compress-engine-macos .
          cd ..
      - name: Install dependencies
        run: npm ci
      - name: Build MSI
        run: npm run tauri build
      - name: Upload MSI to Release
        shell: bash
        run: |
          for i in {1..10}; do
            gh release upload ${{ inputs.release_tag || github.ref_name }} \
              src-tauri/target/release/bundle/msi/*.msi \
              src-tauri/target/release/bundle/nsis/*.exe --clobber && break || sleep 5
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
