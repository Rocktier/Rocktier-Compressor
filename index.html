<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Rocktier Compressor</title>
    <!-- 三态主题防闪烁：必须在内联样式解析前定好，否则浅色系统上先画一帧深色底。
         键与 useTheme.ts 一致（rocktier-compressor-theme）。 -->
    <script>
      (function () {
        try {
          // 2026-10-04：运行时已改读 "rocktier.theme"（键改名统一命名空间），
          // 这里必须同步或回落，否则老用户会看到「先按旧键画首帧、挂载后跳成另一种」。
          var saved = localStorage.getItem("rocktier.theme") || localStorage.getItem("rocktier-compressor-theme");
          var mode;
          if (saved === "light" || saved === "dark") {
            mode = saved;
          } else {
            // 2026-11-15 取消「跟随系统」：旧存 auto 的按当时系统值一次性落定；
            // 从没选过的默认深色。落定后持久化，此后不再跟随系统。
            mode = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
            try { localStorage.setItem("rocktier.theme", mode); } catch (e2) {}
          }
          document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
